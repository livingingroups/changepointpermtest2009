version: '3'

vars:
  PACKAGE_NAME: cpt
  R_CMD: R

tasks:
  default:
    desc: Display available tasks
    cmds:
      - task --list

  docs:
    desc: Generate documentation using roxygen2
    cmds:
      - "{{.R_CMD}} -e 'roxygen2::roxygenize(\".\", c(\"rd\", \"namespace\"))'"

  build:
    desc: Build the package
    deps: [docs]
    cmds:
      - "{{.R_CMD}} CMD build ."

  install:
    desc: Install the package locally
    deps: [build]
    cmds:
      - "{{.R_CMD}} CMD INSTALL {{.PACKAGE_NAME}}_*.tar.gz"

  install-deps:
    desc: Install package dependencies
    cmds:
      - "{{.R_CMD}} -e 'devtools::install_deps(dependencies = TRUE)'"

  check:
    desc: Run R CMD check on the package
    deps: [build]
    cmds:
      - "{{.R_CMD}} CMD check {{.PACKAGE_NAME}}_*.tar.gz"

  check_as_cran:
    desc: Run R CMD check on the package
    deps: [build]
    cmds:
      - "{{.R_CMD}} CMD check --as-cran {{.PACKAGE_NAME}}_*.tar.gz"
      
  tar_ls:
    desc: List the contents of the package
    cmds:
      - "tar -tvf {{.PACKAGE_NAME}}_*.tar.gz"
      
  test:
    desc: Run the tinytests
    cmds:
      - "{{.R_CMD}} -f tests/tinytest.R"

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf "{{.PACKAGE_NAME}}.Rcheck"
      - rm -f "{{.PACKAGE_NAME}}_*.tar.gz"

  clean-src:
    desc: Clean up source files
    cmds:
      - rm -f src/*.o src/*.so src/*.a

  clean-all:
    desc: Clean up all artifacts
    deps: [clean, clean-src]
    
  manual:
    desc: Create the manual
    deps: [docs]
    cmds:
      - rm -f ../../cpt-manual.pdf
      - "{{.R_CMD}} CMD Rd2pdf --output=../../cpt-manual.pdf ."
